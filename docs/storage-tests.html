<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Persistência nativa DanMachi</title>
<h1>Persistência com recarregamento real</h1><pre id="results">Executando…</pre>
<iframe id="app" title="Aplicação em teste" style="width:390px;height:850px"></iframe>
<script src="../items.js"></script><script src="../combat.js"></script><script src="../storage.js"></script>
<script>
'use strict';
const results=[];const out=document.getElementById('results');
const assert=(condition,label)=>{if(!condition)throw new Error(label);results.push('PASS: '+label);};
const delay=()=>new Promise(resolve=>setTimeout(resolve,20));
async function until(check){for(let n=0;n<500;n++){if(check())return;await delay();}throw new Error('Tempo excedido');}
async function run(){
  if(!new URLSearchParams(location.search).has('isolated'))throw new Error('Execute por python docs/run-browser-tests.py. Este caso requer origem e perfil temporários para isolar o localStorage nativo.');
  const I=window.DanMachiItems,R=window.DanMachi,S=window.DanMachiStorage,frame=document.getElementById('app');
  const backup=localStorage.getItem(S.key);
  try{
    const s=R.createCampaign([1,2,3].map(n=>({id:'p'+n,name:'Princesa '+n,summary:'Teste de persistência'})),()=>.99);
    s.phase='intermission';s.battle=3;s.enemy.hp=0;s.hp=10;s.story='História preservada';s.feedback='Recompensas preservadas';
    s.inventory=[I.createItem(s,'heal'),I.createItem(s,'heal'),I.createItem(s,'sword',2),null,null];
    s.equipment.shield=I.createItem(s,'shield',1);s.equipment.amulet=I.createItem(s,'amulet',0,'damage');
    s.buffs={damage:5,armor:2};s.fusion=[s.inventory[0].id,s.inventory[1].id];s.droppedFloors=[1];
    s.rewards={floor:1,pending:[I.createItem(s,'heal',2),I.createItem(s,'shield',2)]};
    assert(S.save(s).ok,'Grava fixture no localStorage nativo do perfil temporário');
    frame.src='../index.html#combat';
    await until(()=>frame.contentDocument?.getElementById('equipment-list')?.children.length===3);
    let d=frame.contentDocument;const $=id=>d.getElementById(id);const read=()=>S.load().state;
    assert(read()&&JSON.stringify(read())===JSON.stringify(s),'Aplicação real restaura o salvamento nativo completo');
    async function reload(){
      await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.contentWindow.location.reload();});
      d=frame.contentDocument;
      await until(()=>$('princess-list').children.length===6);
    }
    await reload();
    assert(JSON.stringify(read())===JSON.stringify(s),'Recarregamento real mantém todos os itens, ordem das princesas e efeitos');
    assert($('fusion-slots').querySelectorAll('[data-item-id]').length===2 && $('reward-list').children.length===2 && $('next-battle').disabled,'Slots de fusão e recompensas pendentes são recuperados sem novo sorteio');
    while($('reward-list').children.length)$('reward-list').querySelector('[data-receive-id]').click();
    const received=JSON.stringify(read().inventory);await reload();
    assert(JSON.stringify(read().inventory)===received && !$('reward-list').children.length,'Itens recebidos não reaparecem como drops após atualizar');
    $('next-battle').click();$('attack').click();
    const afterTurn=JSON.stringify(read());assert(read().buffs.damage===4 && read().buffs.armor===1 && read().enemy.hp===1,'Ação usa bônus equipados e reduz efeitos uma única vez');
    await reload();
    assert(JSON.stringify(read())===afterTurn && $('enemy-hp').value===1,'Atualizar durante combate mantém HP do monstro e duração restante das poções');
    $('attack').click();await reload();
    assert(read().phase==='intermission' && read().xp===10 && read().buffs.damage===3 && read().droppedFloors.length===1,'Atualizar após vitória não repete XP, drops nem ação de poção');
    // Chega ao Game Over pelas ações reais, sem editar o save de uma página aberta.
    for(let action=0;read() && action<500;action++){
      if(read().phase==='combat')$('defend').click();
      else if(read().phase==='intermission'){
        while(read().upgrades.length)$('level-up').querySelector('[data-attribute="luck"]').click();
        while($('reward-list').children.length){$('reward-list').querySelector('[data-refuse-id]').click();$('confirm-yes').click();}
        $('next-battle').click();
      }else break;
    }
    assert(!localStorage.getItem(S.key) && $('feedback').textContent.includes('Game Over'),'Derrota remove a campanha do localStorage nativo');
    await reload();assert($('combat').hidden && $('continue-adventure').disabled,'Atualizar após Game Over não ressuscita campanha ou itens');
  }finally{
    frame.remove();
    if(backup===null)localStorage.removeItem(S.key);else localStorage.setItem(S.key,backup);
  }
}
run().then(()=>out.textContent=results.join('\n')+`\nDONE: ${results.length} verificações aprovadas`).catch(error=>out.textContent=results.join('\n')+'\nFAIL: '+error.stack);
</script></html>
